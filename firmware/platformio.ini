; Local build harness for the upstream ESP-IDF project in this directory.
; The repository is a plain ESP-IDF v5.3 project; this file lets PlatformIO
; (pioarduino platform, ESP-IDF 5.5.4) build it unchanged.
;
;   pio run                 # build
;   pio run -t upload       # flash
;   pio device monitor      # serial log

[platformio]
default_envs = esp32s3
src_dir = main

[env:esp32s3]
; pioarduino platform with ESP-IDF 5.5.4 (closest to the repo's ESP-IDF v5.3 target)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
; If upload auto-detection picks the wrong port, set it explicitly, e.g.
; upload_port = /dev/cu.usbmodemXXXX  (macOS)  or  /dev/ttyUSB0  (Linux)
